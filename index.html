<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الأدوات الذهبي</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .dashboard { background: var(--card-bg); padding: 40px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); width: 90%; max-width: 550px; text-align: center; }
        h1 { color: var(--text-main); margin-bottom: 10px; font-size: 2rem; }
        p { color: var(--text-sub); margin-bottom: 35px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .menu-item { text-decoration: none; background: #fff; border: 2px solid #f1f5f9; padding: 25px 15px; border-radius: 20px; transition: 0.3s; display: flex; flex-direction: column; align-items: center; color: var(--text-main); }
        .menu-item:hover { transform: translateY(-8px); border-color: var(--primary); }
        .menu-item span { font-size: 45px; margin-bottom: 15px; }
        .locked { opacity: 0.6; cursor: not-allowed; border-style: dashed; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>مرحباً بك يا بطل</h1>
        <p>اختر الأداة المطلوبة لبدء معالجة ملفاتك</p>
        <div class="menu-grid">
            <a href="https://aboadawi9-ctrl.github.io/gold-video-merger/" class="menu-item"><span>🎬</span><h3>دمج الفيديوهات</h3></a>
            <a href="split.html" class="menu-item"><span>✂️</span><h3>مقسم الصوت</h3></a>
            <div class="menu-item locked"><span>🚀</span><h3>قريباً..</h3></div>
            <div class="menu-item locked"><span>⚙️</span><h3>الإعدادات</h3></div>
        </div>
    </div>
</body>
</html>
